<svg width="100%" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ModLedger banner">
  <rect width="900" height="200" fill="#0d1117" />
  <!-- decorative shapes -->
  <g fill="#0b1220" opacity="0.9">
    <rect x="40" y="30" width="120" height="120" rx="12" />
    <rect x="180" y="20" width="160" height="160" rx="20" />
    <rect x="360" y="40" width="200" height="120" rx="10" />
  </g>
  <!-- Project title -->
  <text x="50%" y="70" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="36" fill="#ffffff" font-weight="700">ModLedger</text>
  <text x="50%" y="100" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="14" fill="#9aa5b1">Reddit moderation ledger — track account suspend status</text>
  <!-- bottom tech pills -->
  <g transform="translate(110,140)" font-family="system-ui, -apple-system, monospace" font-size="12">
    <rect x="0" y="0" rx="12" ry="12" width="120" height="28" fill="#15181a" stroke="#263238" />
    <text x="60" y="18" text-anchor="middle" fill="#ff4500">HTML</text>
    <rect x="140" y="0" rx="12" ry="12" width="120" height="28" fill="#15181a" stroke="#263238" />
    <text x="200" y="18" text-anchor="middle" fill="#61dafb">CSS</text>
    <rect x="280" y="0" rx="12" ry="12" width="120" height="28" fill="#15181a" stroke="#263238" />
    <text x="340" y="18" text-anchor="middle" fill="#f7df1e">JavaScript</text>
  </g>
</svg>